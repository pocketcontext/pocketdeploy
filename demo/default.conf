server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    location = /up {
        default_type text/plain;
        return 200 'ok\n';
    }
    location = /generation {
        default_type text/plain;
        add_header Cache-Control no-store;
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
