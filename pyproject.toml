[project]
name = "pocketdeploy"
version = "0.1.0"
description = "Recoverable OCI, DigitalOcean, Google Cloud, Hetzner and ONCE deployments with private SQLite state"
requires-python = ">=3.11"
dependencies = ["blue @ git+https://github.com/getcolors/blue.git@9a8ef82373205a7a3c4f543e7f76fa2ca748172d"]

[project.scripts]
pocketdeploy = "pocketdeploy.cli:main"

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/pocketdeploy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
