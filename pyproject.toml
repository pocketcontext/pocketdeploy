[project]
name = "pocketdeploy"
version = "0.1.0"
description = "Recoverable OCI, DigitalOcean, Google Cloud and ONCE deployments with private SQLite state"
requires-python = ">=3.11"
dependencies = ["blue @ git+https://github.com/getcolors/blue.git@784018bb586882efbd91affd42139582a40ea1d1"]

[project.scripts]
pocketdeploy = "pocketdeploy.cli:main"

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/pocketdeploy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
