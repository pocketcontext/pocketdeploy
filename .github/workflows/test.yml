name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked --extra test
      - run: uv run pytest -q
      - run: uv build
      - run: uv run python scripts/test-launcher.py
