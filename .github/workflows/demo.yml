name: Publish verification image
on:
  push:
    branches: [main]
    paths:
      - demo/**
      - .github/workflows/demo.yml
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: demo-image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build local smoke image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: demo
          load: true
          tags: pocketdeploy-demo:test
      - name: Verify health, generation and clean shutdown
        run: |
          docker run -d --name pocketdeploy-demo-test -p 127.0.0.1:8080:80 -e POCKETDEPLOY_TEST=ci-verified pocketdeploy-demo:test
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/up >/dev/null; then break; fi
            sleep 1
          done
          test "$(curl -fsS http://127.0.0.1:8080/up)" = ok
          test "$(curl -fsS http://127.0.0.1:8080/generation)" = ci-verified
          docker stop --time 30 pocketdeploy-demo-test
          test "$(docker inspect --format '{{.State.ExitCode}}' pocketdeploy-demo-test)" = 0
          docker rm pocketdeploy-demo-test
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: demo
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/pocketdeploy-demo:latest
            ghcr.io/${{ github.repository_owner }}/pocketdeploy-demo:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Disposable PocketDeploy verification application
