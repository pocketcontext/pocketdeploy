# Non-secret desired configuration belongs in Git. Keep state and credentials ignored.
schema-version: 1
profile: pocketdeploy-example
workdir: .colors
state-file: .colors.sqlite
provider-compute: oci
compute-prevent-destroy: true
compute-require-existing-state: false
compute-retain-boot-volume: true
oci-config-file-profile: DEFAULT
oci-auth: security_token
oci-region: eu-frankfurt-1
oci-compartment-id: <compartment-ocid>
oci-subnet-id: <existing-public-subnet-ocid>
oci-availability-domain: <availability-domain>
# Set oci-image-id to pin explicitly; otherwise first creation records an
# available Canonical Ubuntu 24.04 image compatible with the requested shape.
oci-shape: VM.Standard.A1.Flex
oci-ocpus: 1
oci-memory-in-gbs: 6
oci-boot-volume-size-in-gbs: 50
oci-boot-volume-vpus-per-gb: 10
compute-ssh-sources:
  - 203.0.113.10/32
compute-http-sources:
  - 0.0.0.0/0
provider-dns: no-infra
provider-smtp: no-infra
once-version: v0.3.3
ssh-private-key-file: .ssh/id_ed25519
ssh-public-key-file: .ssh/id_ed25519.pub
ssh-known-hosts-file: .ssh/known_hosts
# After vaultcontext login and interactive unlock:
# vault-id: <dedicated-vault-id>
# vault-command: vaultcontext
vault-save-after-run: false
once:
  applications:
    - host: example.com
      image: ghcr.io/pocketcontext/pocketdeploy-demo:latest
      # Point DNS to the instance and omit disable_tls for public HTTPS.
      disable_tls: true
      deploy-strategy: rolling
      auto_update: false
      auto_backup: false
      smtp: false
      manage-dns: false
      env:
        - POCKETDEPLOY_EXAMPLE=true
# Mapping env values instead reference COLORS_PAR_* operator parameters:
# env:
#   LITESTREAM_ENDPOINT: app-wikicontext-production-litestream-endpoint
